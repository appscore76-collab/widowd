name: Deploy Supabase (dev)

# Pushes database migrations and Edge Functions to widowd-dev only.
# widowd-staging and any production project are never touched here.
on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

concurrency:
  group: deploy-supabase-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_REF: gzgrbbeohcerznezawna # widowd-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_DEV_DB_PASSWORD repository secrets to deploy to widowd-dev. Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest

      - name: Link widowd-dev
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Push migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --include-all

      - name: Deploy Edge Functions
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF"
