<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widowd – Send private photos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5A57}a:hover{color:#163F3D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #1B2421; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <header style="padding: 52px 16px 6px; display: flex; align-items: center; gap: 8px">
    <a href="Chat.dc.html" aria-label="Cancel" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1B2421">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 20px; font-weight: 800">Send private photos</h1>
      <span style="font-size: 13px; color: #5B6763">to Margaret</span>
    </div>
    <span aria-live="polite" style="{{countStyle}}">{{countText}}</span>
  </header>

  <p style="margin: 6px 20px 10px; padding: 10px 12px; border-radius: 14px; background: #EAF1EE; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: #163F3D">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E5A57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="7" y="7" width="14" height="13" rx="2"></rect><path d="M17 4H5a2 2 0 00-2 2v11"></path><path d="M12 13.5l2 2 3.5-4"></path></svg>
    Tap several photos to send them together — up to 10 at a time.
  </p>

  <div style="margin: 2px 20px 8px; display: flex; align-items: baseline; gap: 8px">
    <span style="font-size: 14px; font-weight: 800">From your phone</span>
    <span style="font-size: 12px; color: #5B6763">These aren’t added to your profile</span>
  </div>

  <div style="padding: 0 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
    <sc-for list="{{library}}" as="p" hint-placeholder-count="9">
      <button type="button" aria-pressed="{{p.pressed}}" aria-label="{{p.label}}" onClick="{{p.toggle}}" style="{{p.style}}">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6E8A81" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="M21 16l-5-5-8 8"></path></svg>
        <span style="{{p.badge}}">{{p.num}}</span>
      </button>
    </sc-for>
  </div>

  <div style="margin: 12px 20px 0; padding: 4px 16px 12px; border-radius: 18px; background: #F4F7F6">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 52px">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 15px; font-weight: 700">View once</span>
        <span style="font-size: 12px; color: #5B6763">Each photo opens one time, then it’s gone</span>
      </span>
      <span style="font-size: 12px; font-weight: 800; color: #1E5A57">Always on</span>
    </div>
    <div role="radiogroup" aria-label="Viewing time per photo" style="display: flex; gap: 8px">
      <sc-for list="{{timers}}" as="t" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{t.checked}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
  </div>

  <p style="margin: 10px 20px 0; display: flex; gap: 8px; align-items: center; font-size: 12px; line-height: 1.4; color: #3F4A46">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E5A57" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path></svg>
    Screenshots and screen recording are blocked in Widowd.
  </p>

  <div style="margin-top: auto; padding: 12px 20px 34px">
    <sc-if value="{{hasSel}}" hint-placeholder-val="{{ true }}">
      <a href="Chat.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 28px; background: #1E5A57; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">
        {{sendLabel}}
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </sc-if>
    <sc-if value="{{noSel}}" hint-placeholder-val="{{ false }}">
      <button type="button" disabled style="width: 100%; height: 56px; border-radius: 28px; border: 0; background: #E3E8E6; color: #5B6763; font-family: inherit; font-size: 17px; font-weight: 700">Select photos to send</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: [1, 4, 6], timer: '10s' };
  }
  toggle(i) {
    const sel = this.state.sel.slice();
    const at = sel.indexOf(i);
    if (at >= 0) sel.splice(at, 1); else if (sel.length < 10) sel.push(i);
    this.setState({ sel });
  }
  renderVals() {
    const s = this.state;
    const tints = ['#C8D9D3', '#F3DECB', '#D3DDEE', '#E6D9EC', '#DCE6E2', '#F6E7C8', '#D8E4DA', '#E9DCD3', '#D6DCEB'];
    const names = ['Garden', 'Holiday', 'Dog', 'Family event', 'Kitchen', 'Beach', 'Allotment', 'Birthday', 'Walk'];
    const library = tints.map((t, i) => {
      const at = s.sel.indexOf(i);
      const on = at >= 0;
      return {
        label: names[i] + ' photo' + (on ? ', selected ' + (at + 1) : ''),
        pressed: on ? 'true' : 'false',
        num: on ? String(at + 1) : '',
        toggle: () => this.toggle(i),
        style: 'position: relative; height: 104px; border-radius: 14px; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; background: ' + t + '; ' + (on ? 'border: 3px solid #1E5A57;' : 'border: 1px solid #D5DDDA;'),
        badge: 'position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 13px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; ' + (on ? 'background: #1E5A57; color: #FFFFFF; border: 2px solid #FFFFFF;' : 'background: rgba(255,255,255,0.7); border: 2px solid #FFFFFF;')
      };
    });
    const timers = ['5s', '10s', 'Until closed'].map((t) => ({
      label: t === '5s' ? '5 seconds' : (t === '10s' ? '10 seconds' : 'Until closed'),
      checked: s.timer === t ? 'true' : 'false',
      pick: () => this.setState({ timer: t }),
      style: 'flex: 1; height: 40px; border-radius: 20px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; ' + (s.timer === t ? 'background: #1E5A57; color: #FFFFFF; border: 1px solid #1E5A57;' : 'background: #FFFFFF; color: #1B2421; border: 1px solid #C9D3CF;')
    }));
    const n = s.sel.length;
    return {
      library, timers,
      hasSel: n > 0, noSel: n === 0,
      countText: n + ' of 10',
      countStyle: 'padding: 6px 12px; border-radius: 14px; font-size: 13px; font-weight: 800; ' + (n ? 'background: #1E5A57; color: #FFFFFF;' : 'background: #F4F7F6; color: #5B6763;'),
      sendLabel: 'Send ' + n + ' view-once photo' + (n === 1 ? '' : 's')
    };
  }
}
</script>
</body>
</html>
