<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widowd – Video chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#D6E6E2}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #22302C; color: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; position: relative; overflow: hidden">
  <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px">
    <svg width="140" height="140" viewBox="0 0 24 24" fill="none" stroke="#4F6A62" stroke-width="1" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
    <span style="font-size: 12px; font-weight: 600; color: #A9BDB7">[Margaret’s video]</span>
  </div>

  <div style="position: absolute; top: 56px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-start">
    <div style="padding: 10px 14px; border-radius: 16px; background: rgba(15,22,20,0.72); display: flex; flex-direction: column; gap: 2px">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 800">Margaret
        <svg width="16" height="16" viewBox="0 0 24 24" role="img" aria-label="Photo verified"><path d="M12 2l3 2.5 4-.5.5 4L22 11l-2.5 3 .5 4-4 .5L12 21l-3-2.5-4 .5-.5-4L2 12l2.5-3-.5-4 4-.5z" fill="#3B82F6"></path><path d="M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </span>
      <span style="font-size: 13px; color: #D6E6E2; font-variant-numeric: tabular-nums">04:12</span>
    </div>
    <div style="width: 104px; height: 148px; border-radius: 18px; background: #3E524C; border: 2px solid rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #D6E6E2">{{selfLabel}}</div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 150px; padding: 10px 14px; border-radius: 14px; background: rgba(15,22,20,0.72); display: flex; gap: 8px; align-items: center; font-size: 13px; color: #FFFFFF">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2C27B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path></svg>
    Calls are never recorded and your number stays private.
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 24px 44px; display: flex; justify-content: space-between; align-items: center">
    <button type="button" aria-label="{{micLabel}}" aria-pressed="{{micPressed}}" onClick="{{toggleMic}}" style="{{micStyle}}">
      <sc-if value="{{micOn}}" hint-placeholder-val="{{ true }}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0014 0M12 18v3"></path></svg>
      </sc-if>
      <sc-if value="{{micOff}}" hint-placeholder-val="{{ false }}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0014 0M12 18v3M4 4l16 16"></path></svg>
      </sc-if>
    </button>
    <button type="button" aria-label="{{camLabel}}" aria-pressed="{{camPressed}}" onClick="{{toggleCam}}" style="{{camStyle}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2"></rect><path d="M16 10l6-3v10l-6-3z"></path></svg>
    </button>
    <button type="button" aria-label="Flip camera" style="width: 60px; height: 60px; border-radius: 30px; border: 0; background: rgba(255,255,255,0.18); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><path d="M9 13a3 3 0 015-2.2M15 13a3 3 0 01-5 2.2"></path></svg>
    </button>
    <a href="Chat.dc.html" aria-label="End call" style="width: 72px; height: 72px; border-radius: 36px; background: #D93636; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 9c-3.2 0-6.2.9-8.6 2.5-.6.4-.8 1.1-.6 1.8l.7 2.1c.2.6.9 1 1.5.8l3-1c.5-.2.8-.6.8-1.1V12.6c2-.6 4.4-.6 6.4 0v1.5c0 .5.3.9.8 1.1l3 1c.6.2 1.3-.2 1.5-.8l.7-2.1c.2-.7 0-1.4-.6-1.8C18.2 9.9 15.2 9 12 9z"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mic: true, cam: true };
  }
  renderVals() {
    const base = 'width: 60px; height: 60px; border-radius: 30px; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; ';
    const on = 'background: rgba(255,255,255,0.18); color: #FFFFFF;';
    const off = 'background: #FFFFFF; color: #1B2421;';
    const { mic, cam } = this.state;
    return {
      micOn: mic,
      micOff: !mic,
      micLabel: mic ? 'Mute microphone' : 'Unmute microphone',
      micPressed: mic ? 'false' : 'true',
      micStyle: base + (mic ? on : off),
      toggleMic: () => this.setState({ mic: !mic }),
      camLabel: cam ? 'Turn camera off' : 'Turn camera on',
      camPressed: cam ? 'false' : 'true',
      camStyle: base + (cam ? on : off),
      toggleCam: () => this.setState({ cam: !cam }),
      selfLabel: cam ? '[You]' : 'Camera off'
    };
  }
}
</script>
</body>
</html>
