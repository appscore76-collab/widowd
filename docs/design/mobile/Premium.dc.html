<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widowd – Choose your plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5A57}a:hover{color:#163F3D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #1B2421; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="background: #1E5A57; color: #FFFFFF; padding: 50px 20px 16px; display: flex; align-items: flex-start; gap: 8px">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #F2C27B">CHOOSE YOUR PLAN</span>
      <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.4px; line-height: 1.2">Start free. Upgrade when you’re ready.</h1>
    </div>
    <a href="Discover.dc.html" aria-label="Close" style="flex: none; width: 44px; height: 44px; margin-right: -8px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </div>

  <div style="margin: 12px 20px 0; display: flex; flex-direction: column; font-size: 13px">
    <div style="display: flex; align-items: flex-end">
      <span style="flex: 1; padding-bottom: 6px; font-size: 12px; font-weight: 700; color: #5B6763">What you get</span>
      <span style="width: 56px; padding-bottom: 6px; text-align: center; font-size: 12px; font-weight: 800; color: #5B6763">Free</span>
      <span style="width: 56px; padding: 6px 0; text-align: center; font-size: 12px; font-weight: 800; color: #FFFFFF; background: #1E5A57; border-radius: 10px 10px 0 0">Plus</span>
    </div>
    <sc-for list="{{features}}" as="f" hint-placeholder-count="7">
      <div style="display: flex; align-items: stretch; border-top: 1px solid #EEF2F0">
        <span style="flex: 1; padding: 4px 0; font-weight: 600">{{f.label}}</span>
        <span style="width: 56px; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{f.free}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E5A57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Included in Free"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
          <sc-if value="{{f.notFree}}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Not in Free" style="color: #8C9894; font-weight: 700">—</span></sc-if>
        </span>
        <span style="width: 56px; display: flex; align-items: center; justify-content: center; background: #EAF1EE">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E5A57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Included in Plus"><path d="M5 12l5 5 9-10"></path></svg>
        </span>
      </div>
    </sc-for>
  </div>

  <div role="radiogroup" aria-label="Plans" style="margin: 14px 20px 0; display: flex; flex-direction: column; gap: 7px">
    <sc-for list="{{plans}}" as="pl" hint-placeholder-count="4">
      <button type="button" role="radio" aria-checked="{{pl.checked}}" onClick="{{pl.pick}}" style="{{pl.style}}">
        <span style="{{pl.dot}}"></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 1px; text-align: left">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 800; color: #1B2421">{{pl.name}}<span style="{{pl.tagStyle}}">{{pl.tag}}</span></span>
          <span style="font-size: 12px; color: #5B6763">{{pl.sub}}</span>
        </span>
        <span style="display: flex; flex-direction: column; align-items: flex-end">
          <span style="font-size: 15px; font-weight: 800; color: #1B2421">{{pl.price}}</span>
          <span style="font-size: 11px; color: #5B6763">{{pl.per}}</span>
        </span>
      </button>
    </sc-for>
  </div>

  <div style="margin-top: auto; padding: 10px 20px 26px; display: flex; flex-direction: column; gap: 6px">
    <button type="button" style="{{ctaStyle}}">{{cta}}</button>
    <p style="margin: 0; min-height: 30px; font-size: 11px; line-height: 1.4; color: #5B6763; text-align: center">{{legal}}</p>
    <div style="display: flex; justify-content: center; gap: 4px; font-size: 13px; font-weight: 600">
      <a href="Premium.dc.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 8px">Restore purchase</a><a href="Premium.dc.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 8px">Terms</a><a href="Premium.dc.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 8px">Privacy</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { plan: 'month' };
  }
  renderVals() {
    const p = this.state.plan;
    const features = [
      ['Registration', true],
      ['Peer-support community', true],
      ['Suggestions & sending likes', true],
      ['See who likes you', true],
      ['Like back, match & see photos', false],
      ['Message & video chat', false],
      ['Share my date & location', false],
      ['Photo verified & ID badges', false],
      ['Incognito & view-once photos', false]
    ].map(([label, free]) => ({ label, free, notFree: !free }));
    const defs = [
      { id: 'free', name: 'Free', sub: 'Like, see who likes you & Community', price: '£0', per: 'forever', tag: '' },
      { id: 'week', name: 'Weekly', sub: 'Try Plus, cancel anytime', price: '[PRICE]', per: 'per week', tag: '' },
      { id: 'month', name: 'Monthly', sub: 'Billed every month', price: '[PRICE]', per: 'per month', tag: 'Most popular' },
      { id: 'six', name: '6 months', sub: '[PRICE] billed every 6 months', price: '[PRICE]', per: 'per month', tag: 'Best value' }
    ];
    const plans = defs.map((d) => {
      const on = d.id === p;
      return Object.assign({}, d, {
        checked: on ? 'true' : 'false',
        pick: () => this.setState({ plan: d.id }),
        style: 'display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 8px 14px; border-radius: 16px; font-family: inherit; cursor: pointer; ' + (on ? 'background: #EAF1EE; border: 2px solid #1E5A57;' : 'background: #FFFFFF; border: 1px solid #C9D3CF;'),
        dot: 'flex: none; width: 22px; height: 22px; border-radius: 11px; box-sizing: border-box; ' + (on ? 'border: 7px solid #1E5A57; background: #FFFFFF;' : 'border: 2px solid #8C9894;'),
        tagStyle: d.tag ? 'padding: 2px 7px; border-radius: 8px; font-size: 10px; font-weight: 800; letter-spacing: 0.3px; text-transform: uppercase; ' + (d.id === 'six' ? 'background: #FBF0DF; color: #7A4B0E;' : 'background: #1E5A57; color: #FFFFFF;') : 'display: none'
      });
    });
    const free = p === 'free';
    const names = { week: 'Weekly', month: 'Monthly', six: '6-month' };
    return {
      features, plans,
      cta: free ? 'Continue with Free' : 'Start ' + names[p] + ' Plus',
      ctaStyle: 'height: 56px; border-radius: 28px; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer; ' + (free ? 'background: #FFFFFF; color: #1E5A57; border: 2px solid #1E5A57;' : 'background: #1E5A57; color: #FFFFFF; border: 0;'),
      legal: free
        ? 'No payment needed. You can upgrade any time from your profile.'
        : 'Charged to your Apple ID. Renews automatically unless cancelled at least 24 hours before the period ends.'
    };
  }
}
</script>
</body>
</html>
