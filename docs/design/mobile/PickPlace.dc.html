<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widowd – Choose a place</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5A57}a:hover{color:#163F3D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #1B2421; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <header style="padding: 52px 16px 6px; display: flex; align-items: center; gap: 8px">
    <a href="PlanDate.dc.html" aria-label="Back to plan a date" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1B2421">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.4px">Choose a place</h1>
      <span style="font-size: 13px; color: #5B6763">for your date with Margaret</span>
    </div>
  </header>

  <div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <label for="place-q" style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 25px; border: 2px solid #1E5A57; background: #FFFFFF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E5A57" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="place-q" type="search" placeholder="Search a café, park or full address" aria-label="Search for a place or address" onInput="{{onSearch}}" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 15px; color: #1B2421">
    </label>
    <div role="tablist" aria-label="Type of place" style="display: flex; gap: 6px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{c.selected}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="margin: 12px 20px 0; height: 170px; border-radius: 18px; background: #DCE6E2; position: relative; overflow: hidden">
    <svg width="350" height="170" viewBox="0 0 350 170" aria-hidden="true" style="position: absolute; inset: 0"><path d="M0 50 L350 80 M0 130 L350 40 M90 0 L130 170 M250 0 L230 170" stroke="#FFFFFF" stroke-width="9" fill="none"></path><path d="M30 150 C 120 120, 200 150, 330 110" stroke="#B9D3E3" stroke-width="12" fill="none"></path></svg>
    <span style="position: absolute; left: 30px; top: 104px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 800; color: #1E3A8A"><span style="width: 14px; height: 14px; border-radius: 7px; background: #2563EB; border: 3px solid #FFFFFF"></span>You</span>
    <span style="position: absolute; right: 30px; top: 26px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 800; color: #1B2421"><span style="width: 22px; height: 22px; border-radius: 11px; background: #C8D9D3; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px">M</span>Margaret</span>
    <span style="position: absolute; left: 132px; top: 46px; width: 84px; height: 84px; border-radius: 42px; border: 2px dashed #1E5A57; background: rgba(30,90,87,0.08)"></span>
    <span style="position: absolute; left: 136px; top: 132px; padding: 2px 8px; border-radius: 8px; background: #1E5A57; color: #FFFFFF; font-size: 10px; font-weight: 800">Halfway zone</span>
    <sc-for list="{{pins}}" as="pin" hint-placeholder-count="3">
      <span style="{{pin.style}}"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z" fill="{{pin.fill}}" stroke="#FFFFFF" stroke-width="1.5"></path><circle cx="12" cy="10" r="2.5" fill="#FFFFFF"></circle></svg></span>
    </sc-for>
    <span style="position: absolute; right: 10px; bottom: 8px; font-size: 10px; font-weight: 600; color: #3F5A52">[Map]</span>
  </div>

  <div role="radiogroup" aria-label="Places" style="flex: 1; min-height: 0; overflow-y: auto; padding: 10px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{places}}" as="p" hint-placeholder-count="4">
      <button type="button" role="radio" aria-checked="{{p.checked}}" onClick="{{p.pick}}" style="{{p.style}}">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: left">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 800; color: #1B2421">{{p.name}}<span style="{{p.tagStyle}}">Halfway</span></span>
          <span style="font-size: 12px; color: #3F4A46">{{p.type}} · {{p.addr}}</span>
          <span style="font-size: 12px; color: #5B6763">{{p.dist}}</span>
        </span>
        <span style="{{p.dot}}"></span>
      </button>
    </sc-for>
    <sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 8px 0; font-size: 14px; color: #5B6763; text-align: center">No public places match. Try a town or postcode.</p>
    </sc-if>
  </div>

  <div style="padding: 10px 20px 30px; border-top: 1px solid #E3E8E6; display: flex; flex-direction: column; gap: 6px">
    <span style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #5B6763">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1E5A57" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path></svg>
      We only suggest busy public places for first dates
    </span>
    <a href="PlanDate.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 28px; background: #1E5A57; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">{{cta}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', cat: 'all', sel: 'orchard' };
  }
  renderVals() {
    const s = this.state;
    const all = [
      { id: 'orchard', name: 'The Orchard Café', type: 'Café', addr: '14 Bridge St, Chester', dist: '3.1 mi from you · 2.9 mi from Margaret', half: true, x: 150, y: 60 },
      { id: 'tearoom', name: 'Grosvenor Park Tea Room', type: 'Café', addr: 'Grosvenor Park, Chester', dist: '3.4 mi from you · 3.0 mi from Margaret', half: true, x: 178, y: 86 },
      { id: 'park', name: 'Grosvenor Park', type: 'Park', addr: 'Vicars Ln, Chester', dist: '3.3 mi from you · 3.1 mi from Margaret', half: true, x: 196, y: 54 },
      { id: 'rose', name: 'The Rose & Thistle', type: 'Restaurant', addr: '2 Watergate St, Chester', dist: '2.8 mi from you · 3.6 mi from Margaret', half: false, x: 110, y: 96 },
      { id: 'gallery', name: 'Riverside Gallery', type: 'Museum', addr: 'The Groves, Chester', dist: '3.7 mi from you · 2.6 mi from Margaret', half: false, x: 236, y: 110 }
    ];
    const q = s.q.trim().toLowerCase();
    const list = all.filter((p) => (s.cat === 'all' || p.type === s.cat) && (!q || (p.name + ' ' + p.addr + ' ' + p.type).toLowerCase().includes(q)));
    const places = list.map((p) => {
      const on = s.sel === p.id;
      return Object.assign({}, p, {
        checked: on ? 'true' : 'false',
        pick: () => this.setState({ sel: p.id }),
        style: 'display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 14px; border-radius: 16px; font-family: inherit; cursor: pointer; ' + (on ? 'background: #EAF1EE; border: 2px solid #1E5A57;' : 'background: #FFFFFF; border: 1px solid #C9D3CF;'),
        dot: 'flex: none; width: 22px; height: 22px; border-radius: 11px; box-sizing: border-box; ' + (on ? 'border: 7px solid #1E5A57; background: #FFFFFF;' : 'border: 2px solid #8C9894;'),
        tagStyle: p.half ? 'padding: 1px 6px; border-radius: 7px; background: #FBF0DF; color: #7A4B0E; font-size: 10px; font-weight: 800' : 'display: none'
      });
    });
    const pins = list.map((p) => ({
      style: 'position: absolute; left: ' + p.x + 'px; top: ' + p.y + 'px;',
      fill: s.sel === p.id ? '#1E5A57' : '#C9852C'
    }));
    const catDefs = [['all', 'All'], ['Café', 'Cafés'], ['Restaurant', 'Food'], ['Park', 'Parks'], ['Museum', 'Culture']];
    const cats = catDefs.map(([id, label]) => ({
      label, selected: s.cat === id ? 'true' : 'false',
      pick: () => this.setState({ cat: id }),
      style: 'flex: 1; min-width: 0; height: 36px; padding: 0; border-radius: 18px; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; ' + (s.cat === id ? 'background: #1B2421; color: #FFFFFF; border: 1px solid #1B2421;' : 'background: #FFFFFF; color: #1B2421; border: 1px solid #C9D3CF;')
    }));
    const chosen = all.find((p) => p.id === s.sel);
    return {
      places, pins, cats,
      noResults: places.length === 0,
      cta: 'Meet at ' + chosen.name,
      onSearch: (e) => this.setState({ q: e.target.value })
    };
  }
}
</script>
</body>
</html>
