<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widowd – Profile search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5A57}a:hover{color:#163F3D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F7F6; color: #1B2421; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; position: relative; overflow: hidden; padding: 56px 0 0">
  <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.6px">Search</h1>
    <label for="search-q" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 24px; background: #FFFFFF; border: 1px solid #C9D3CF; color: #5B6763">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="search-q" type="search" placeholder="Interests, town or keyword" aria-label="Search profiles" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 15px; color: #1B2421">
    </label>
  </div>

  <div style="display: flex; gap: 8px; padding: 12px 20px 4px; overflow-x: auto; scrollbar-width: none">
    <button type="button" aria-pressed="{{vPressed}}" onClick="{{toggleV}}" style="{{vStyle}}">
      <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 2.5 4-.5.5 4L22 11l-2.5 3 .5 4-4 .5L12 21l-3-2.5-4 .5-.5-4L2 12l2.5-3-.5-4 4-.5z" fill="currentColor"></path></svg>Photo verified
    </button>
    <button type="button" aria-pressed="{{iPressed}}" onClick="{{toggleI}}" style="{{iStyle}}">ID checked</button>
    <span style="flex: none; display: inline-flex; align-items: center; height: 36px; padding: 0 12px; border-radius: 18px; background: #FFFFFF; border: 1px solid #C9D3CF; font-size: 13px; font-weight: 600">≤ 25 mi</span>
    <span style="flex: none; display: inline-flex; align-items: center; height: 36px; padding: 0 12px; border-radius: 18px; background: #FFFFFF; border: 1px solid #C9D3CF; font-size: 13px; font-weight: 600">55–65</span>
  </div>
  <p style="margin: 4px 20px 8px; font-size: 12px; color: #5B6763">{{countText}} · Verification filters are a Plus feature</p>

  <ul style="list-style: none; margin: 0; padding: 0 20px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{results}}" as="r" hint-placeholder-count="4">
      <li>
        <a href="Profile.dc.html" style="display: flex; gap: 12px; padding: 12px; border-radius: 18px; background: #FFFFFF; text-decoration: none; color: #1B2421">
          <div style="flex: none; position: relative; width: 64px; height: 64px; border-radius: 16px; overflow: hidden; background: #C8D9D3">
            <div style="{{r.photo}}"></div>
            <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B2421" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 018 0v4"></path></svg></span>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 16px; font-weight: 800">{{r.name}}</span>
            <span style="font-size: 12px; color: #5B6763">{{r.meta}}</span>
            <div style="display: flex; flex-wrap: wrap; gap: 5px">
              <sc-if value="{{r.verified}}" hint-placeholder-val="{{ true }}">
                <span style="display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 9px; background: #E5EDFD; color: #1E40AF; font-size: 11px; font-weight: 700"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 2.5 4-.5.5 4L22 11l-2.5 3 .5 4-4 .5L12 21l-3-2.5-4 .5-.5-4L2 12l2.5-3-.5-4 4-.5z" fill="#2563EB"></path></svg>Photo verified</span>
              </sc-if>
              <sc-if value="{{r.idChecked}}" hint-placeholder-val="{{ true }}">
                <span style="padding: 2px 7px; border-radius: 9px; background: #EAF1EE; color: #1E5A57; font-size: 11px; font-weight: 700">ID checked</span>
              </sc-if>
              <span style="padding: 2px 7px; border-radius: 9px; background: #F4F7F6; color: #3F4A46; font-size: 11px; font-weight: 700">{{r.intent}}</span>
            </div>
          </div>
        </a>
      </li>
    </sc-for>
  </ul>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding-top: 8px; background: #FFFFFF; border-top: 1px solid #E3E8E6; display: flex; justify-content: space-around; align-items: flex-start">
    <a href="Discover.dc.html" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: #5B6763; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="12" r="6"></circle><circle cx="15" cy="12" r="6"></circle></svg>Discover</a>
    <a href="Search.dc.html" aria-current="page" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: #1E5A57; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Search</a>
    <a href="Community.dc.html" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: #5B6763; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 9h2a2 2 0 012 2v5a2 2 0 01-2 2h-1v3l-3-3h-4a2 2 0 01-2-2v-1"></path><path d="M3 5a2 2 0 012-2h8a2 2 0 012 2v6a2 2 0 01-2 2H8l-3 3v-3H5a2 2 0 01-2-2z"></path></svg>Community</a>
    <a href="Matches.dc.html" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: #5B6763; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"></path></svg>Chats</a>
    <a href="Incognito.dc.html" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: #5B6763; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>Me</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { v: false, i: false };
  }
  chip(on) {
    return 'flex: none; display: inline-flex; align-items: center; gap: 5px; height: 36px; padding: 0 12px; border-radius: 18px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; ' + (on ? 'background: #1E5A57; color: #FFFFFF; border: 1px solid #1E5A57;' : 'background: #FFFFFF; color: #1B2421; border: 1px solid #C9D3CF;');
  }
  renderVals() {
    const { v, i } = this.state;
    const tints = ['#C8D9D3', '#D3DDEE', '#F3DECB', '#E6D9EC', '#DCE6E2'];
    const all = [
      { name: 'Margaret, 58', meta: 'Chester · 6 mi · 2 children', intent: 'Long-term', verified: true, idChecked: true },
      { name: 'Eileen, 61', meta: 'Wrexham · 14 mi · 3 children', intent: 'Companionship', verified: true, idChecked: false },
      { name: 'Patricia, 55', meta: 'Ellesmere Port · 9 mi · No children', intent: 'Long-term', verified: false, idChecked: false },
      { name: 'Linda, 63', meta: 'Northwich · 21 mi · 1 child', intent: 'Marriage', verified: true, idChecked: true },
      { name: 'Joan, 59', meta: 'Mold · 12 mi · 4 children', intent: 'Not sure yet', verified: false, idChecked: true }
    ];
    const results = all
      .map((r, n) => Object.assign({}, r, { photo: 'width: 100%; height: 100%; background: ' + tints[n] + '; filter: blur(6px); transform: scale(1.3);' }))
      .filter((r) => (!v || r.verified) && (!i || r.idChecked));
    return {
      results,
      countText: results.length + ' people near Chester',
      vPressed: v ? 'true' : 'false', iPressed: i ? 'true' : 'false',
      vStyle: this.chip(v), iStyle: this.chip(i),
      toggleV: () => this.setState({ v: !v }),
      toggleI: () => this.setState({ i: !i })
    };
  }
}
</script>
</body>
</html>
